
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>STUDENT PORTAL</h1>
    <p>Student Registration System</p>
</header>

<div class="container">
    <h2>Registration Form</h2>
    <p class="subtitle">Please fill in your information</p>

    <form id="studentForm">
        <label>Student ID</label>
        <input type="text" id="studentId" placeholder="Enter Student ID" required>

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter Full Name" required>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter Email" required>

        <label>Course</label>
        <select id="course" required>
            <option value="">Select Course</option>
            <option>BS Information Technology</option>
            <option>BS Computer Science</option>
            <option>BS Education</option>
            <option>BS Tourism</option>
            <option>BS Business Administration</option>
        </select>

        <label>Year Level</label>
        <select id="year" required>
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>

        <label>Contact Number</label>
        <input type="tel" id="contact" placeholder="Enter Contact Number" required>

        <button type="submit">REGISTER STUDENT</button>
    </form>

    <h2 class="list-title">Registered Students</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Year</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentList"></tbody>
        </table>
    </div>

    <p id="message"></p>
</div>

<script src="script.js"></script>
</body>
</html>
